<div class="story"><h1>Le marché du samedi</h1>
<p>Chaque samedi, la place se remplit de producteurs venus des villages voisins, avec leurs fromages et leurs légumes.</p>
<p>Les habitués arrivent tôt pour les meilleures tomates, et les touristes suivent vers dix heures.</p>
