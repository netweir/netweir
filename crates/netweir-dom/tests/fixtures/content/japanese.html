    <h1>小さな町の本屋が再開</h1>
    <p class="date"><time datetime="2026-10-09">2026年10月9日</time></p>
    <div class="article-text">
      <p>昨年の春に閉店した駅前の古い本屋が、地元の若い夫婦の手で再び店を開いた。木の棚や看板はそのまま残し、絵本と地域の歴史に関する本を中心にそろえている。</p>
      <p>店主の佐藤さんは「子どものころに通った店をなくしたくなかった」と話す。週末には読み聞かせの会も開かれ、初日から多くの家族連れでにぎわった。</p>
