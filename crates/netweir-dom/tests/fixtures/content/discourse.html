  <div id="topic-title"><h1><a href="/t/should-the-formatter-wrap/1182">Should the formatter wrap long string literals?</a></h1>
  <div class="topic-category"><a href="/c/ideas/6">Ideas</a></div></div>
  <div class="topic-body crawler-post" id="post_1" itemprop="mainEntity">
    <div class="crawler-post-meta"><span class="creator" itemprop="author"><a href="/u/kestrel"><span itemprop="name">kestrel</span></a></span>
    <time datetime="2026-07-29T15:40:42Z" class="post-time">July 29, 2026</time></div>
    <div class="post" itemprop="text"><p>At the moment the formatter leaves string literals alone however long they are, so a single error message can push a line well past the limit. I would like it to split them at word boundaries using implicit concatenation.</p>
    <p>The obvious risk is changing the meaning of code that relies on the exact layout, but I cannot think of a case where adjacent literals behave differently from one long literal.</p></div>
  </div>
  <div class="topic-body crawler-post" id="post_2" itemprop="comment">
    <div class="crawler-post-meta"><span class="creator" itemprop="author"><a href="/u/oldspoke"><span itemprop="name">oldspoke</span></a></span></div>
    <div class="post" itemprop="text"><p>Byte strings and f-strings would need care, and splitting inside an escape sequence would be a nasty bug to ship. I would rather see it behind an option first, so that people can try it on real code bases.</p></div>
  </div>
  <div class="topic-body crawler-post" id="post_3" itemprop="comment">
    <div class="crawler-post-meta"><span class="creator" itemprop="author"><a href="/u/kestrel"><span itemprop="name">kestrel</span></a></span></div>
    <div class="post" itemprop="text"><p>An option seems fair. I will write up the escape sequence cases in the proposal so the behaviour is pinned down before anyone implements it.</p></div>
  </div>
</div>
