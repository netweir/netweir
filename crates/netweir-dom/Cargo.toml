[package]
name = "netweir-dom"
description = "HTML and XML parsing and CSS and XPath queries for netweir"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
netweir-html = { path = "../netweir-html" }
memchr = "2"
quick-xml = "0.42"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
stacker = "0.1"
url = "2"
