[package]
name = "netweir-dom"
description = "HTML and XML parsing and CSS and XPath queries for netweir, built on lexbor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
links = "lexbor"

[build-dependencies]
cc = "1"

[dependencies]
memchr = "2"
quick-xml = "0.42"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stacker = "0.1"
url = "2"
