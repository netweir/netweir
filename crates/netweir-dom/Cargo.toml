[package]
name = "netweir-dom"
description = "HTML and XML parsing and CSS and XPath queries for netweir"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The HTML parser and XPath are Parsec's (https://github.com/parsec-html/parsec),
# under the names netweir-html and netweir-xpath that the code uses.
netweir-html = { package = "parsec-web-core", version = "0.3.0" }
netweir-xpath = { package = "parsec-xpath", version = "0.3.0" }
memchr = "2"
quick-xml = "0.42"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
stacker = "0.1"
url = "2"
