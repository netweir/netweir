// netweir
// Read by a Firefox `netweir install firefox` installed, at every start.
// Started by anything but Netweir, which names a port file in
// NETWEIR_FIREFOX_PORT_FILE, it does nothing: that Firefox is a stock one.
//
// Started by Netweir, it turns on Firefox's remote control start, which
// runs the WebDriver BiDi server without the automation flag, so
// navigator.webdriver stays false. Firefox confines that session to the
// container named "remote-control-container", and a session can't use a
// tab outside it, so the browser's one window is swapped for one whose tab
// is in that container. Then the server starts on a free port, and the
// port is written to the file.
// Any failure is written beside the port file, `NETWEIR-FIREFOX failed:
// <step>: <error>`, for Netweir to read: release Firefox writes nothing
// of the cfg's to stderr, and Windows Firefox's stderr doesn't reach
// Netweir anyway.
let portFile = "";
try {
  portFile = Services.env.get("NETWEIR_FIREFOX_PORT_FILE");
} catch (e) {}
// Writing takes a window's IOUtils: a failure before there is one is
// written once there is.
const fail = (step, e) => {
  const message = `NETWEIR-FIREFOX failed: ${step}: ${e}`;
  const write = (win) => win.IOUtils.writeUTF8(portFile + ".failed", message).catch(() => {});
  const win = Services.wm.getMostRecentBrowserWindow();
  if (win) {
    write(win);
    return;
  }
  Services.obs.addObserver(function later(subject) {
    Services.obs.removeObserver(later, "browser-delayed-startup-finished");
    write(subject);
  }, "browser-delayed-startup-finished");
};
try {
  if (portFile) {
    // The default branch, so nothing is written to the profile's prefs.js.
    const defaults = Services.prefs.getDefaultBranch("");
    defaults.setBoolPref("remote.experimental.dynamicstart.enabled", true);
    defaults.setBoolPref("remote.experimental.dynamicstart.prompt.enabled", false);
    // The banner takes 39 pixels off the page's height, which it can see.
    defaults.setBoolPref("remote.experimental.dynamicstart.banner.enabled", false);
    defaults.setBoolPref("remote.experimental.dynamicstart.connectionbanner.enabled", false);

    // The server, once the window is in the container. Firefox's remote
    // control start always listens on 9222; any free port instead lets
    // several run at once.
    const listen = (win) => {
      const httpd = ChromeUtils.importESModule("chrome://remote/content/server/httpd.sys.mjs");
      const original = httpd.nsHttpServer.prototype._start;
      httpd.nsHttpServer.prototype._start = function (port, ...rest) {
        return original.call(this, port == 9222 ? -1 : port, ...rest);
      };
      const { RemoteAgent } = ChromeUtils.importESModule(
        "chrome://remote/content/components/RemoteAgent.sys.mjs"
      );
      RemoteAgent.startAtRuntime({ isBrowserAutomation: false }).then(
        // Moved into place whole, so Netweir never reads half a port.
        (port) =>
          win.IOUtils.writeUTF8(portFile + ".tmp", String(port))
            .then(() => win.IOUtils.move(portFile + ".tmp", portFile))
            .catch((e) => fail("port file", e)),
        (e) => fail("remote agent", e)
      );
    };

    const swapWindow = () => {
      const { ContextualIdentityService } = ChromeUtils.importESModule(
        "moz-src:///toolkit/components/contextualidentity/ContextualIdentityService.sys.mjs"
      );
      const name = "remote-control-container";
      const identity =
        ContextualIdentityService.getPublicIdentities().find((i) => i.name == name) ||
        ContextualIdentityService.create(name, "circle", "red");
      const first = Services.wm.getMostRecentBrowserWindow();
      const { setTimeout } = ChromeUtils.importESModule("resource://gre/modules/Timer.sys.mjs");
      // The new window takes the first one's place: a cascaded window is
      // somewhere a person's isn't.
      const [x, y, width, height] = [first.screenX, first.screenY, first.outerWidth, first.outerHeight];
      // The server starts once the first window is gone from the window
      // list too, which on Windows can come after its close is told: a
      // session started sooner opened windows from the closing one, whose
      // contexts were discarded.
      const gone = () =>
        ![...Services.wm.getEnumerator("navigator:browser")].includes(first) &&
        Services.wm.getMostRecentBrowserWindow() !== first;
      const whenGone = (tries) => {
        if (!gone() && tries > 0) {
          setTimeout(() => whenGone(tries - 1), 10);
          return;
        }
        try {
          listen(Services.wm.getMostRecentBrowserWindow());
        } catch (e) {
          fail("remote agent", e);
        }
      };
      Services.obs.addObserver(function closed(subject) {
        if (subject !== first) return;
        Services.obs.removeObserver(closed, "domwindowclosed");
        // Ten seconds at most.
        whenGone(1000);
      }, "domwindowclosed");
      Services.obs.addObserver(function ready(subject) {
        if (subject === first) return;
        Services.obs.removeObserver(ready, "browser-delayed-startup-finished");
        // The system can still be placing a new window (macOS cascades
        // it from the last) when it's first moved, so the move is made
        // again until it holds, for a second at most.
        // A first window the system maximized (as Firefox does on a small
        // screen) has no frame above its tabs, which a page can measure:
        // the new one is maximized too, or put where the first one was.
        const maximized = first.windowState == first.STATE_MAXIMIZED;
        const place = (tries) => {
          try {
            let placed;
            if (maximized) {
              subject.maximize();
              placed = subject.windowState == subject.STATE_MAXIMIZED;
            } else {
              subject.moveTo(x, y);
              subject.resizeTo(width, height);
              placed =
                subject.screenX == x && subject.screenY == y &&
                subject.outerWidth == width && subject.outerHeight == height;
            }
            if (!placed && tries > 0) {
              setTimeout(() => place(tries - 1), 20);
              return;
            }
            // In front, as the first was: the most recent window is the
            // one new windows open from.
            subject.focus();
            first.close();
          } catch (e) {
            fail("window", e);
          }
        };
        place(50);
      }, "browser-delayed-startup-finished");
      first.openTrustedLinkIn("about:blank", "window", { userContextId: identity.userContextId });
    };

    Services.obs.addObserver(function idle() {
      Services.obs.removeObserver(idle, "browser-idle-startup-tasks-finished");
      try {
        swapWindow();
      } catch (e) {
        fail("window", e);
      }
    }, "browser-idle-startup-tasks-finished");
  }
} catch (e) {
  if (portFile) fail("start", e);
}
