[package]
name = "netweir-browser"
description = "Drives Chrome over the DevTools protocol, without the calls pages can detect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.23"
btls = "0.5.6"
chromium-roots = "0.1.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tokio-btls = "0.5.6"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
