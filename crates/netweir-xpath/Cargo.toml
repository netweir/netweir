[package]
name = "netweir-xpath"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "XPath 1.0 over netweir-html's document tree, or any tree that implements its Tree trait."
repository.workspace = true
license.workspace = true
publish = false

[features]
default = ["html"]
# XPath over netweir-html's tree. Without it, a caller brings its own Tree.
html = ["dep:netweir-html"]

[dependencies]
netweir-html = { path = "../netweir-html", optional = true }
stacker = "0.1"

[[test]]
name = "xpath"
required-features = ["html"]

[[test]]
name = "libxml2"
required-features = ["html"]
