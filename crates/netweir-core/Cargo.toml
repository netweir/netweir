[package]
name = "netweir-core"
description = "netweir's fetching engine: browser-identical HTTP requests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
brotli = "9"
netweir-browser = { path = "../netweir-browser" }
netweir-dom = { path = "../netweir-dom" }
btls = "0.5.6"
bytes = "1"
chardetng = "1"
data-encoding = "2"
encoding_rs = "0.8"
flate2 = "1"
http = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.11"
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
toml = "1"
url = "2"
wreq-proto = { version = "0.2.6", default-features = false }
# wreq's own, for a connector layer: its Layer and Service traits alone.
tower = { version = "0.5.3", default-features = false }
wreq = { version = "0.16.1", default-features = false, features = ["chromium-roots", "tokio-rt", "gzip", "brotli", "zstd", "deflate", "cookies"] }
zstd = "0.14"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
psl = "2.1"
cookie = "0.18"
http-body-util = "0.1"
# The shared queue.
# Known limit: plain TCP only. netweir's TLS is BoringSSL, and a second
# TLS stack for this alone isn't worth it yet.
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager"] }

# HTTP/3 as Firefox sends it: Mozilla's own QUIC stack, at the tag Firefox
# 161 pins (netwerk/socket/neqo_glue/Cargo.toml), over NSS through nss-rs.
# Cargo.lock holds nss-rs at the commit Firefox 161's lockfile does
# (bb8ed19). Building needs NSS first: scripts/nss.sh.
neqo-common = { git = "https://github.com/mozilla/neqo", tag = "v0.34.0", optional = true }
neqo-http3 = { git = "https://github.com/mozilla/neqo", tag = "v0.34.0", optional = true }
neqo-transport = { git = "https://github.com/mozilla/neqo", tag = "v0.34.0", optional = true }
neqo-udp = { git = "https://github.com/mozilla/neqo", tag = "v0.34.0", optional = true }
nss-rs = { git = "https://github.com/mozilla/nss-rs", optional = true }
quinn-udp = { version = "0.6", default-features = false, features = ["log", "fast-apple-datapath"], optional = true }
# HTTP/3 as Chrome and Safari send it: netweir's fork of Cloudflare's
# quiche, built on btls, the BoringSSL the TCP connections use, with
# Chrome's and Safari's transport parameters, Initial packets, HTTP/3
# SETTINGS and QPACK decoding added (branch safari-27, on chrome-157; see
# its README).
quiche = { git = "https://github.com/netweir/quiche", rev = "d6baf79e04798338c09cc252e537ee4faa065b15", features = ["custom-client-dcid"], optional = true }
# The roots each profile's connections trust: the Chrome Root Store for
# Chrome's and Safari's (wreq's own default), and Mozilla's for Firefox's,
# from CCADB. 1.0.11 holds exactly the 118 server-auth trust anchors of
# NSS 3.133, the NSS Firefox 161 ships (docs/design/roots.md).
chromium-roots = "0.1.3"
webpki-root-certs = "=1.0.11"
# wreq's own response decompression, for responses over HTTP/3.
tower-http = { version = "0.7.1", default-features = false, features = ["decompression-gzip", "decompression-br", "decompression-zstd", "decompression-deflate"], optional = true }
http-body = { version = "1", optional = true }
# NO_PROXY networks, parsed as wreq parses them (already in wreq's tree).
ipnet = { version = "2.12", optional = true }

[features]
# Requests over HTTP/3 with a Firefox profile (src/h3.rs) or a Chrome one
# (src/h3_chrome.rs). Off by default:
# it needs NSS built (scripts/nss.sh) and NSS_DIR set.
http3 = ["dep:quiche", "dep:neqo-common", "dep:neqo-http3", "dep:neqo-transport", "dep:neqo-udp", "dep:nss-rs", "dep:quinn-udp", "dep:tower-http", "dep:http-body", "dep:ipnet", "dep:libc", "dep:windows-sys"]

# HTTPS DNS records through the system resolver, as Firefox queries them
# (src/https_rr.rs).
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_NetworkManagement_Dns", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
netweir-fingerprint = { path = "../netweir-fingerprint" }
# The HPKE that opens a recorded ClientHelloInner (examples/ech_capture.rs).
btls-sys = "0.5.6"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
