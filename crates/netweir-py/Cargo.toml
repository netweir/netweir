[package]
name = "netweir-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
csv = "1"
netweir-browser = { path = "../netweir-browser" }
netweir-core = { path = "../netweir-core" }
netweir-dom = { path = "../netweir-dom" }
parquet = { version = "60", default-features = false, features = ["snap"] }
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module", "multiple-pymethods"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
url = "2"

[lints.rust]
# Set by .cargo/config.toml for PyO3; lib.rs reports it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(pyo3_disable_reference_pool)"] }
