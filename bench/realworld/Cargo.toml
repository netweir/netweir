[package]
name = "bench-realworld"
version = "0.0.0"
edition = "2024"
publish = false

# Outside the workspace, like bench/others/spider: html5ever is the
# reference here, not something Netweir ships.
[workspace]

[dependencies]
chardetng = "1"
encoding_rs = "0.8"
html5ever = "0.40.1"
markup5ever_rcdom = "0.40.1"
netweir-html = { package = "parsec-web-core", version = "0.3.1" }
regex = "1"
serde_json = "1"
