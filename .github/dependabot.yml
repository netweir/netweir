version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # The TLS and HTTP stack is pinned on purpose: a new version can
      # change the fingerprint, so it's moved by hand with the profile
      # tests run against it.
      - dependency-name: wreq
      - dependency-name: btls
      - dependency-name: btls-sys
      - dependency-name: tokio-btls
      - dependency-name: http2
      # HTTP/3 and NSS follow the tag and commit Firefox's own lockfile
      # pins, and move with a new Firefox profile.
      - dependency-name: neqo-common
      - dependency-name: neqo-http3
      - dependency-name: neqo-transport
      - dependency-name: neqo-udp
      - dependency-name: nss-rs
      # Each browser's trusted roots: Mozilla's must be the NSS the Firefox
      # profile's release ships, and Chrome's the store Chrome uses.
      - dependency-name: webpki-root-certs
      - dependency-name: chromium-roots
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
