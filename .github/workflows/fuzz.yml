name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse, css, xpath, js, text, edit, markdown, xml, auto]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz for five minutes
        working-directory: crates/netweir-dom
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -max_len=4096 ${{ matrix.target == 'xml' && '-dict=fuzz/xml.dict' || '' }}
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: crates/netweir-dom/fuzz/artifacts
