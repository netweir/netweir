name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
      - run: uv sync --group dev
      - run: uv run maturin develop --uv
      - run: uv run netweir install chrome
        timeout-minutes: 10
      - run: uv run python .github/exp/enobufs_experiment.py
