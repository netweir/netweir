name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's run, on the pull request merged onto the latest main.
  merge_group:
  workflow_dispatch:

# A new push to a pull request ends the run on its old commit, which
# otherwise held the few macOS runners for an hour. Runs on main all
# finish: each one tests a commit that landed.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # XPath without the HTML parser, as a crate with a tree of its own
      # uses it: tests/tree.rs queries a tree written by hand.
      - run: cargo clippy -p netweir-xpath --no-default-features --all-targets -- -D warnings
      - run: cargo test -p netweir-xpath --no-default-features
      # The fuzz crates sit outside the workspace and build only in the
      # nightly fuzz run, so a manifest that cargo can't load fails there.
      - run: for m in crates/*/fuzz/Cargo.toml; do cargo metadata --no-deps --format-version 1 --manifest-path "$m" > /dev/null || exit 1; done
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      # A prebuilt binary: the cargo-deny action builds a Docker image on
      # every run, and fails whenever Docker Hub does.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      - run: cargo deny check licenses bans sources

  # Known vulnerabilities in the Rust dependencies, from the RustSec
  # database. Not a required check: a new advisory shouldn't block an
  # unrelated pull request, but it shows red until it's fixed.
  # The project's history credits people, not tools: no commit on main may
  # carry an AI co-author or a "generated with" line. Checks the pull
  # request's commits and description, and in the merge queue the commit
  # that will land.
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No AI co-author or generated-with lines
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='co-authored-by:.*(claude|anthropic|openai|chatgpt|copilot|gemini)|generated with \[?claude|noreply@anthropic\.com'
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
            exit 0
          fi
          bad=0
          if git log --format='%H%n%B' "$BASE..$HEAD" | grep -Eiq "$pattern"; then
            echo "::error::a commit message credits an AI tool:"
            git log --format='%h %s%n%b' "$BASE..$HEAD" | grep -Ei -B2 "$pattern" || true
            bad=1
          fi
          if printf '%s' "$BODY" | grep -Eiq "$pattern"; then
            echo "::error::the pull request description credits an AI tool; a squash merge would copy it into main"
            bad=1
          fi
          exit "$bad"

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      - run: cargo deny check advisories

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14", "3.14t"]
        # The free plan runs five macOS jobs at once, and each run wanted
        # five, so a pull request (or the merge queue) tests macOS on 3.14
        # alone. Every push to main runs all three there.
        exclude: ${{ github.event_name != 'push' && fromJSON('[{"os":"macos-latest","python":"3.11"},{"os":"macos-latest","python":"3.14t"}]') || fromJSON('[]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Chrome is installed below, so the browser tests run, not skip.
      NETWEIR_REQUIRE_CHROME: "1"
      # And Firefox.
      NETWEIR_REQUIRE_FIREFOX: "1"
      # And redis-server, but not on Windows, which has no build of it.
      NETWEIR_REQUIRE_REDIS: ${{ matrix.os != 'windows-latest' && '1' || '' }}
      # The macOS runners are virtual machines whose GPU now and then hangs
      # on Chrome's work, until the kernel stops taking any from it and
      # Chrome waits for good. Software rendering never touches it.
      #
      # On Windows 11 22H2 and later, Chrome picks each connection's local
      # port at random, and one still in TIME_WAIT fails it with
      # ERR_NO_BUFFER_SPACE; after the many short connections of cargo
      # test, a page's own requests to the test servers now and then
      # failed so. Netweir retries a navigation that fails that way, but
      # not a page's own requests, which Chrome makes; on users' machines
      # Chrome keeps its default, as the browser it passes for does.
      NETWEIR_CHROME_ARGS: >-
        ${{ matrix.os == 'macos-latest' && '--disable-gpu'
        || matrix.os == 'windows-latest' && '--disable-features=TcpPortRandomizationWin'
        || '' }}
      # .cargo/config.toml's flags less the leak: a Python object dropped
      # off Python's threads aborts the tests instead of leaking quietly.
      RUSTFLAGS: --cfg pyo3_disable_reference_pool
      # uv run would sync again and put back what the sync step below
      # leaves out on purpose.
      UV_NO_SYNC: "1"
    steps:
      # Spotlight indexes every file the build and the tests write, and on
      # a 3-core macOS runner that, with Chrome, left a launch or a new
      # page waiting past its 30 s now and then. Off, a probe running four
      # Chromes at a time for 25 minutes saw none over 20 s. Named volumes,
      # not -a: some images have a Preboot volume without an index, and
      # mdutil fails on it.
      - if: runner.os == 'macOS'
        run: sudo mdutil -i off / /System/Volumes/Data
      # The runner's Dock fills its 1024 px screen, so each app that
      # starts or quits resizes its icons and the Dock's height with them,
      # and a maximized window is as tall as the Dock leaves room for. The
      # headed Firefox stealth test compares two Firefoxes started seconds
      # apart; whether the first one's icon had joined the Dock yet made
      # its window 3 px shorter now and then. A hidden Dock leaves the
      # same room whatever is running.
      - if: runner.os == 'macOS'
        run: defaults write com.apple.dock autohide -bool true && killall Dock
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      # pywin32, which the MCP SDK needs on Windows, has no free-threaded
      # build, so there the MCP tests skip (docs/mcp.md says so too).
      - run: >-
          uv sync
          ${{ matrix.os == 'windows-latest' && matrix.python == '3.14t'
          && '--no-group mcp' || '' }}
      - run: uv run maturin develop --uv
      # The Chrome for Testing build netweir's profiles are tuned for, as a
      # user gets it, rather than whatever Chrome the runner image carries:
      # the macOS runners' own Chrome now and then stopped answering for
      # half a minute at a time.
      - run: uv run netweir install chrome
        timeout-minutes: 10
      # Mozilla's own build, unpacked and checked against its pinned
      # SHA-256 as a user gets it, which tests the installer on each system.
      - run: uv run netweir install firefox
        timeout-minutes: 10
      # Ubuntu stops the user namespaces Chrome's sandbox needs unless an
      # AppArmor profile allows them, and only Google Chrome's package
      # installs one. This keeps the sandbox on (see docs/browser.md).
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # For the queue's tests against a real Redis, each starting its own,
      # and the display the headed Firefox test opens its window on.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends redis-server xvfb
      - if: runner.os == 'macOS'
        run: brew install redis
      # A fresh runner's first Chrome start is the slow one, and a test
      # with a few seconds' timeout can't wait for it: start it once here.
      - name: Start Chrome once
        shell: bash
        run: |
          uv run python - <<'EOF'
          import asyncio, netweir

          async def start():
              await (await netweir.browser(timeout=120)).close()

          asyncio.run(start())
          EOF
      # A hung test fails the step, which keeps its log; cancelling the
      # run instead loses it.
      # A display on Linux, for the headed Firefox the stealth test
      # compares; the other systems' runners have one.
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}cargo test --workspace --exclude netweir-py
        timeout-minutes: 30
        env:
          # Where a failing headed stealth test saves the screen, kept below.
          NETWEIR_FAILURE_DIR: ${{ runner.temp }}/netweir-failure
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/netweir-failure
          if-no-files-found: ignore
          retention-days: 7
      # On Windows chrome-headless-shell is a console program, so it shares
      # a `netweir serve` job's console; a serve test cancels a job using it.
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          shell=$(uv run python -c "from netweir._native import install_chrome; print(install_chrome(headless_shell=True)[1])")
          echo "NETWEIR_TEST_HEADLESS_SHELL=$shell" >> "$GITHUB_ENV"
        timeout-minutes: 10
      # The slowest runners take about 9 minutes for the suite. A hung test
      # prints every thread's stack after five (faulthandler_timeout), and
      # the slowest tests are listed, so the limit can stay loose.
      - run: uv run pytest -q --durations=20
        timeout-minutes: 20

  # The browser tests again, against the runner's Google Chrome rather
  # than Chrome for Testing. Branded Chrome holds rules of its own, such
  # as refusing to be driven on its default profile, and the release's
  # wheel checks run on it: a difference should show here, not there.
  google-chrome:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            chrome: /usr/bin/google-chrome
          - os: macos-latest
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
            args: --disable-gpu
          - os: windows-latest
            chrome: C:\Program Files\Google\Chrome\Application\chrome.exe
            args: --disable-features=TcpPortRandomizationWin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NETWEIR_REQUIRE_CHROME: "1"
      NETWEIR_CHROME: ${{ matrix.chrome }}
      # As in the test job above.
      NETWEIR_CHROME_ARGS: ${{ matrix.args }}
      RUSTFLAGS: --cfg pyo3_disable_reference_pool
    steps:
      # As in the test job above.
      - if: runner.os == 'macOS'
        run: sudo mdutil -i off / /System/Volumes/Data
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --group dev
      - run: uv run maturin develop --uv
      # A fresh runner's first Chrome start can take over 30 seconds on
      # Windows; this one has two minutes, so no test pays for it.
      - name: Start Chrome once
        shell: bash
        run: |
          uv run python - <<'EOF'
          import asyncio, netweir

          async def start():
              await (await netweir.browser(timeout=120)).close()

          asyncio.run(start())
          EOF
      - run: uv run pytest -q --durations=10 tests/test_browser.py tests/test_crawl_browser.py
        timeout-minutes: 15

  # HTTP/3 with the Firefox, Chrome and Safari profiles (netweir-core's
  # http3 feature): NSS built by scripts/nss.sh, then the tests that hold
  # each request over HTTP/3 to Firefox 160's, Chrome 157's and Safari
  # 27's recordings. The quiche fork needs no C library of its own: it links the
  # BoringSSL the TCP connections already build. Every system and architecture a
  # wheel is built for builds it; the x86_64 macOS build runs its tests
  # under Rosetta. Linux runs them in release builds, which link NSS the
  # way a wheel would.
  http3:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, release: --release }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, release: --release }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # NSS builds with gyp and ninja, and on Windows under MSYS2's bash with
      # MSVC and Mozilla's nsinstall, as Mozilla's own CI builds it.
      - name: NSS's build tools
        shell: bash
        run: |
          uv tool install gyp-next==0.22.4
          uv tool install ninja==1.13.0
          uv tool dir --bin >> "$GITHUB_PATH"
      - if: matrix.target == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - if: runner.os == 'Windows'
        name: MSVC's environment
        # vcvars64.bat's environment, as ilammy/msvc-dev-cmd set it; that
        # action still runs on Node 20 and has had no release since 2024.
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the x64 C++ tools" }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$matches[1]] -ne $matches[2]) {
              "$($matches[1])=$($matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            }
          }
          if ($LASTEXITCODE) { throw "vcvars64.bat failed" }
      - if: runner.os == 'Windows'
        name: MSYS2 and nsinstall
        shell: bash
        run: |
          mkdir -p "$HOME/bin"
          curl --fail --silent --show-error -o "$HOME/bin/nsinstall" \
            https://hg-edge.mozilla.org/releases/mozilla-release/raw-file/FIREFOX_160_0_RELEASE/config/nsinstall.py
          echo "f88df5591ee50d6e86625efd6e5f9c7b0dd4cba61e27ab533b1990115e100caf  $HOME/bin/nsinstall" | sha256sum -c -
          sed -i '1i #! /usr/bin/env python3' "$HOME/bin/nsinstall"
          chmod +x "$HOME/bin/nsinstall"
          python3 -m pip install mozfile==3.0.0
          { echo C:/msys64/usr/bin; echo C:/msys64/mingw64/bin; cygpath -m "$HOME/bin"; } >> "$GITHUB_PATH"
          case "${VSCMD_VER%%.*}" in 17) year=2022 ;; 18) year=2026 ;; *) year= ;; esac
          if [ -n "$year" ]; then
            { echo "VSPATH=$VSINSTALLDIR"
              echo "GYP_MSVS_OVERRIDE_PATH=$VSINSTALLDIR"
              echo "GYP_MSVS_VERSION=$year"; } >> "$GITHUB_ENV"
          fi
      # From here on `bash` is MSYS2's, whose link.exe would shadow MSVC's.
      - if: runner.os == 'Windows'
        shell: bash
        run: rm -f /usr/bin/link.exe
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/nss/${{ matrix.target }}
          key: nss-${{ matrix.target }}-${{ hashFiles('scripts/nss.sh') }}
      - name: NSS
        shell: bash
        run: scripts/nss.sh ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo clippy -p netweir-core --features http3 --all-targets -- -D warnings
      - run: cargo test ${{ matrix.release }} -p netweir-core --features http3 --target ${{ matrix.target }} --lib --test http3 --test http3_chrome --test http3_safari --test http3_ech --test ech_tcp --test fingerprint --test tls_retry

  # Chrome's suites of actions, pages, events and steps again, on Firefox,
  # and the browser from Python and in a crawl.
  # A test that can't pass there yet is listed in tests/common/mod.rs,
  # with what it waits for.
  firefox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      NETWEIR_TEST_ENGINE: firefox
      NETWEIR_REQUIRE_FIREFOX: "1"
      RUSTFLAGS: --cfg pyo3_disable_reference_pool
    steps:
      # As in the test job above.
      - if: runner.os == 'macOS'
        run: sudo mdutil -i off / /System/Volumes/Data
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --group dev
      - run: uv run maturin develop --uv
      # As a user gets it, which tests the installer on each system too.
      - run: uv run netweir install firefox
        timeout-minutes: 10
      - run: cargo test --no-fail-fast -p netweir-browser --test actions --test page --test events --test steps --test network --test storage
        timeout-minutes: 20
      # The browser from Python, on Firefox: tests that are Chrome's alone
      # say why in their skip.
      - run: uv run pytest -q --durations=10 -rs tests/test_browser.py tests/test_crawl_browser.py
        timeout-minutes: 15

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --group dev --group bench
      - run: uv run maturin develop --uv --release
      - run: uv run python bench/parse.py --check
      - run: uv run python bench/query.py --check
      - run: uv run python bench/items.py --check
      - run: uv run python bench/content.py --check
      # The final boss, small: 300 of Parsec's seeded pages (broken
      # fragments, encoding quirks, giants cut to 2 MB) as bytes, each
      # library in its own process. Fails if Netweir crashes, hangs or
      # raises on a page, or another library is faster over the batch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: parsec-html/parsec
          ref: 4d6fe823b25974f3aab19750060231b97df06445
          path: parsec
          submodules: true
          persist-credentials: false
      - run: uv run python bench/boss.py --smoke --check --parsec parsec
      # The whole crawl, once, with Netweir alone, then over the final
      # boss pages the step above built: fails if Netweir reads a page
      # wrong, misses one or reads one twice. The results, with every
      # run's raw items and server timings, are kept as an artifact.
      - run: uv run python bench/crawl.py --only netweir --repeats 1 --now --check --results bench-results
      - run: >-
          uv run python bench/crawl.py --only netweir --repeats 1 --now --check --results bench-results
          --boss bench/.cache/boss/300-20261119-2000000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-crawl-results
          path: bench-results
          if-no-files-found: ignore
