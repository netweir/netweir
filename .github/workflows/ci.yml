name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      # A prebuilt binary: the cargo-deny action builds a Docker image on
      # every run, and fails whenever Docker Hub does.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - run: cargo deny check licenses bans sources

  # Known vulnerabilities in the Rust dependencies, from the RustSec
  # database. Not a required check: a new advisory shouldn't block an
  # unrelated pull request, but it shows red until it's fixed.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - run: cargo deny check advisories

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14", "3.14t"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Chrome is installed below, so the browser tests run, not skip.
      NETWEIR_REQUIRE_CHROME: "1"
      # And redis-server, but not on Windows, which has no build of it.
      NETWEIR_REQUIRE_REDIS: ${{ matrix.os != 'windows-latest' && '1' || '' }}
      # The macOS runners are virtual machines whose GPU now and then hangs
      # on Chrome's work, until the kernel stops taking any from it and
      # Chrome waits for good. Software rendering never touches it.
      #
      # On Windows 11 22H2 and later, Chrome picks each connection's local
      # port at random, and one still in TIME_WAIT fails it with
      # ERR_NO_BUFFER_SPACE; after the many short connections of cargo
      # test, a page's own requests to the test servers now and then
      # failed so. Netweir retries a navigation that fails that way, but
      # not a page's own requests, which Chrome makes; on users' machines
      # Chrome keeps its default, as the browser it passes for does.
      NETWEIR_CHROME_ARGS: >-
        ${{ matrix.os == 'macos-latest' && '--disable-gpu'
        || matrix.os == 'windows-latest' && '--disable-features=TcpPortRandomizationWin'
        || '' }}
      # .cargo/config.toml's flags less the leak: a Python object dropped
      # off Python's threads aborts the tests instead of leaking quietly.
      RUSTFLAGS: --cfg pyo3_disable_reference_pool
    steps:
      # Spotlight indexes every file the build and the tests write, and on
      # a 3-core macOS runner that, with Chrome, left a launch or a new
      # page waiting past its 30 s now and then. Off, a probe running four
      # Chromes at a time for 25 minutes saw none over 20 s.
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run maturin develop --uv
      # The Chrome for Testing build netweir's profiles are tuned for, as a
      # user gets it, rather than whatever Chrome the runner image carries:
      # the macOS runners' own Chrome now and then stopped answering for
      # half a minute at a time.
      - run: uv run netweir install chrome
        timeout-minutes: 10
      # Ubuntu stops the user namespaces Chrome's sandbox needs unless an
      # AppArmor profile allows them, and only Google Chrome's package
      # installs one. This keeps the sandbox on (see docs/browser.md).
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # For the queue's tests against a real Redis; each starts its own.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends redis-server
      - if: runner.os == 'macOS'
        run: brew install redis
      # A fresh runner's first Chrome start is the slow one, and a test
      # with a few seconds' timeout can't wait for it: start it once here.
      - name: Start Chrome once
        shell: bash
        run: |
          uv run python - <<'EOF'
          import asyncio, netweir

          async def start():
              await (await netweir.browser(timeout=120)).close()

          asyncio.run(start())
          EOF
      # A hung test fails the step, which keeps its log; cancelling the
      # run instead loses it.
      - run: cargo test --workspace --exclude netweir-py
        timeout-minutes: 30
      # On Windows chrome-headless-shell is a console program, so it shares
      # a `netweir serve` job's console; a serve test cancels a job using it.
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          shell=$(uv run python -c "from netweir._native import install_chrome; print(install_chrome(headless_shell=True)[1])")
          echo "NETWEIR_TEST_HEADLESS_SHELL=$shell" >> "$GITHUB_ENV"
        timeout-minutes: 10
      # The slowest runners take about 9 minutes for the suite. A hung test
      # prints every thread's stack after five (faulthandler_timeout), and
      # the slowest tests are listed, so the limit can stay loose.
      - run: uv run pytest -q --durations=20
        timeout-minutes: 20

  # The browser tests again, against the runner's Google Chrome rather
  # than Chrome for Testing. Branded Chrome holds rules of its own, such
  # as refusing to be driven on its default profile, and the release's
  # wheel checks run on it: a difference should show here, not there.
  google-chrome:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            chrome: /usr/bin/google-chrome
          - os: macos-latest
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
            args: --disable-gpu
          - os: windows-latest
            chrome: C:\Program Files\Google\Chrome\Application\chrome.exe
            args: --disable-features=TcpPortRandomizationWin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NETWEIR_REQUIRE_CHROME: "1"
      NETWEIR_CHROME: ${{ matrix.chrome }}
      # As in the test job above.
      NETWEIR_CHROME_ARGS: ${{ matrix.args }}
      RUSTFLAGS: --cfg pyo3_disable_reference_pool
    steps:
      # As in the test job above.
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --group dev
      - run: uv run maturin develop --uv
      # A fresh runner's first Chrome start can take over 30 seconds on
      # Windows; this one has two minutes, so no test pays for it.
      - name: Start Chrome once
        shell: bash
        run: |
          uv run python - <<'EOF'
          import asyncio, netweir

          async def start():
              await (await netweir.browser(timeout=120)).close()

          asyncio.run(start())
          EOF
      - run: uv run pytest -q --durations=10 tests/test_browser.py tests/test_crawl_browser.py
        timeout-minutes: 15

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --group dev --group bench
      - run: uv run maturin develop --uv --release
      - run: uv run python bench/parse.py --check
      - run: uv run python bench/query.py --check
      - run: uv run python bench/items.py --check
      - run: uv run python bench/content.py --check
