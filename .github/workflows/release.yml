name: release

# Wheels for every platform on every version tag; a manual run builds them
# without publishing, to check a release before tagging it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # The commit's time, for the wheel's timestamps and SBOM: two builds
      # of one commit then give the same wheel, byte for byte.
      - name: Pin build timestamps to the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: One wheel for Python 3.11 and later, one for free-threaded 3.14
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          # BoringSSL builds with CMake.
          before-script-linux: dnf install -y cmake perl-IPC-Cmd clang
          docker-options: -e SOURCE_DATE_EPOCH
          args: --release --out dist -i python3.11 -i python3.14t
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # The commit's time, for the wheel's timestamps and SBOM: two builds
      # of one commit then give the same wheel, byte for byte.
      - name: Pin build timestamps to the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.11
            3.14t
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.11 -i python3.14t
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # The commit's time, for the wheel's timestamps and SBOM: two builds
      # of one commit then give the same wheel, byte for byte.
      - name: Pin build timestamps to the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.11
            3.14t
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x64
          args: --release --out dist -i python3.11 -i python3.14t
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # The commit's time, for the wheel's timestamps and SBOM: two builds
      # of one commit then give the same wheel, byte for byte.
      - name: Pin build timestamps to the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist

  # Every wheel installs and passes the tests before anything is published.
  check:
    needs: [linux, macos, windows]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.11", "3.14", "3.14t"]
    runs-on: ${{ matrix.os }}
    steps:
      # As in ci.yml: Spotlight indexing what the tests write left Chrome
      # waiting past its timeouts on macOS runners.
      - if: runner.os == 'macOS'
        run: sudo mdutil -i off / /System/Volumes/Data
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - name: Install the built wheel, not the source
        run: |
          uv venv
          uv pip install --no-index --find-links dist netweir
          # Everything the tests import, from the same list CI uses.
          uv pip install --group dev
          # The MCP SDK can't install on free-threaded Windows (ci.yml).
          if [[ "${{ runner.os }}-${{ matrix.python }}" != Windows-3.14t ]]; then
            uv pip install --group mcp
          fi
          rm -rf python
          uv run --no-project pytest -q tests
        shell: bash

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI trusted publishing: no token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      # To create the release and attach the files.
      contents: write
      # To sign the build provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Signed provenance for every file, checkable with
      # `gh attestation verify FILE --repo netweir/netweir`; the bundle is
      # attached to the release too.
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - run: cp "$BUNDLE" "dist/netweir-${GITHUB_REF_NAME}.intoto.jsonl"
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      # Notes list the pull requests merged since the last tag; the files
      # are the ones just published to PyPI.
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Netweir ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
