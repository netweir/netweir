# Advisories OSV-Scanner (and the OpenSSF Scorecard) report against
# uv.lock that don't reach Netweir or its users. Scrapy and Twisted are in
# the dev group only, for the Scrapy compatibility tests and the crawl
# benchmark; nothing Netweir ships depends on either.

# Scrapy 1.4's 2017 advisory has no fixed version in its record, so every
# release matches it. It's about a feature as Scrapy 1.4 had it.
[[IgnoredVulns]]
id = "PYSEC-2017-83"
reason = "Recorded against Scrapy 1.4 with no upper bound; dev-only dependency"

