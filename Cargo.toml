[workspace]
resolver = "3"
members = ["crates/netweir-dom", "crates/netweir-core", "crates/netweir-browser", "crates/netweir-fingerprint", "crates/netweir-py"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/netweir/netweir"
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1

# Chrome's handshake since 154 (ML-DSA and GREASE signature algorithms, trust
# anchors) needs wreq and btls commits that are not on crates.io yet. These
# are the exact revisions their maintainer pins for the same purpose.
[patch.crates-io]
wreq = { git = "https://github.com/0x676e67/wreq", rev = "cd76bcdf1307153de289d34e072528bdf0510a3b" }
btls = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
