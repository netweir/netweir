[workspace]
resolver = "3"
members = ["crates/netweir-dom", "crates/netweir-core", "crates/netweir-browser", "crates/netweir-fingerprint", "crates/netweir-py"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/netweir/netweir"
rust-version = "1.89"

[profile.release]
lto = "thin"
codegen-units = 1

# Chrome's handshake since 154 (ML-DSA and GREASE signature algorithms, trust
# anchors) needs wreq and btls commits that are not on crates.io yet. These
# are the exact revisions their maintainer pins for the same purpose, from
# netweir's forks: wreq plus connect_to, ech_config_list, connect_only,
# ech_inner_like_nss and tls_verify_callback, and btls plus
# set_ech_inner_like_nss (branch netweir of each, see their READMEs).
[patch.crates-io]
wreq = { git = "https://github.com/netweir/wreq", rev = "ca33cafe306b21fa5ddc9f29873567b5af835040" }
btls = { git = "https://github.com/netweir/btls", rev = "c7b4c5cbe92206b8c4c0e95e83ab1c8075ef0d95" }
btls-sys = { git = "https://github.com/netweir/btls", rev = "c7b4c5cbe92206b8c4c0e95e83ab1c8075ef0d95" }
