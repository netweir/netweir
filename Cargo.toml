[workspace]
resolver = "3"
members = ["crates/netweir-html", "crates/netweir-xpath", "crates/netweir-dom", "crates/netweir-core", "crates/netweir-browser", "crates/netweir-fingerprint", "crates/netweir-py"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/netweir/netweir"
rust-version = "1.89"

[profile.release]
lto = "thin"
codegen-units = 1

# Chrome's handshake since 154 (ML-DSA and GREASE signature algorithms, trust
# anchors) needs wreq and btls commits that are not on crates.io yet. These
# are the exact revisions their maintainer pins for the same purpose; wreq
# comes from netweir's fork, at that revision plus connect_to,
# ech_config_list and connect_only (branch netweir, see its README).
[patch.crates-io]
wreq = { git = "https://github.com/netweir/wreq", rev = "4256d2584ce93f253aaeb7c46aec0fec8e69fab8" }
btls = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
