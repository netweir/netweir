[workspace]
resolver = "3"
members = ["crates/netweir-html", "crates/netweir-xpath", "crates/netweir-dom", "crates/netweir-core", "crates/netweir-browser", "crates/netweir-fingerprint", "crates/netweir-py"]

[workspace.package]
version = "0.10.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/netweir/netweir"
rust-version = "1.89"

[profile.release]
lto = "thin"
codegen-units = 1

# Chrome's handshake since 154 (ML-DSA and GREASE signature algorithms, trust
# anchors) needs wreq and btls commits that are not on crates.io yet. These
# are the exact revisions their maintainer pins for the same purpose, from
# netweir's forks: wreq plus connect_to, ech_config_list, connect_only and
# ech_inner_like_nss, and btls plus set_ech_inner_like_nss (branch netweir
# of each, see their READMEs).
[patch.crates-io]
wreq = { git = "https://github.com/netweir/wreq", rev = "e75d68f4dd1c37d91005da7cb467c37bf46121d3" }
btls = { git = "https://github.com/netweir/btls", rev = "1788f675aba654d5c3022c8189d2343f51ddfe53" }
btls-sys = { git = "https://github.com/netweir/btls", rev = "1788f675aba654d5c3022c8189d2343f51ddfe53" }
