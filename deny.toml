# Licences netweir can ship under AGPL-3.0 and sell under a commercial
# licence. Anything GPL-only would rule out the commercial licence.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list is what netweir accepts, not what it uses today.
unused-allowed-license = "allow"

# netweir's own crates.
[[licenses.exceptions]]
crate = "netweir-dom"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
crate = "netweir-html"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
crate = "netweir-xpath"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
crate = "netweir-core"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
crate = "netweir-browser"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
crate = "netweir-fingerprint"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
crate = "netweir-py"
allow = ["AGPL-3.0-only"]

# A public-domain hash used by parquet's hasher; CC0 grants no patent
# licence, so it is allowed for this crate only.
[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]

# Mozilla's root certificates, as CCADB publishes them, under the CCADB
# data terms: permissive, no copyleft, the licence or a link to it kept
# with the data. Allowed for this crate only.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# A hash the Redis client needs. The Boost licence is permissive, asks
# for no notice in binaries and allows commercial use; allowed for this
# crate only, as it's the only one under it.
[[licenses.exceptions]]
crate = "xxhash-rust"
allow = ["BSL-1.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Netweir's wreq and btls forks, pinned in Cargo.toml's
# [patch.crates-io], and Mozilla's neqo and nss-rs, which Firefox takes from git too (netweir-core's
# http3 feature, at the tag and commit Firefox 160 pins), and netweir's own
# quiche fork for Chrome's HTTP/3 (same feature).
allow-git = [
    "https://github.com/netweir/wreq",
    "https://github.com/netweir/btls",
    "https://github.com/mozilla/neqo",
    "https://github.com/mozilla/nss-rs",
    "https://github.com/netweir/quiche",
]

[advisories]
ignore = [
    # chrono is unmaintained, every version. Only parquet pulls it in, for
    # netweir-py, and no parquet release does without it. Drop this once
    # parquet moves off chrono or onto a maintained fork; check with
    # `cargo tree -i chrono`. Other unmaintained notices still fail.
    { id = "RUSTSEC-2026-0543", reason = "only via parquet, which has no release without chrono yet" },
    # humantime is unmaintained. Only neqo's qlog pulls it in, with the
    # http3 feature, and Firefox ships the same; qlog stays off. Drop this
    # once qlog moves off it (`cargo tree -i humantime --all-features`).
    { id = "RUSTSEC-2026-0542", reason = "only via neqo's qlog, as in Firefox; qlog is never turned on" },
]
