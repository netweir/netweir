# Licences netweir can ship under AGPL-3.0 and sell under a commercial
# licence. Anything GPL-only would rule out the commercial licence.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list is what netweir accepts, not what it uses today.
unused-allowed-license = "allow"

# netweir's own crates.
[[licenses.exceptions]]
crate = "netweir-dom"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
crate = "netweir-core"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
crate = "netweir-browser"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
crate = "netweir-fingerprint"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
crate = "netweir-py"
allow = ["AGPL-3.0-only"]

# A public-domain hash used by parquet's hasher; CC0 grants no patent
# licence, so it is allowed for this crate only.
[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]

# A hash the Redis client needs. The Boost licence is permissive, asks
# for no notice in binaries and allows commercial use; allowed for this
# crate only, as it's the only one under it.
[[licenses.exceptions]]
crate = "xxhash-rust"
allow = ["BSL-1.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The unreleased wreq and btls commits pinned in Cargo.toml's [patch.crates-io].
allow-git = ["https://github.com/0x676e67/wreq", "https://github.com/0x676e67/btls"]
