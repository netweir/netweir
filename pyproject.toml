[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "netweir"
description = "An ultra-fast, self-healing, undetectable web scraper: Rust does the work, you write Python"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "James Conway" }]
keywords = ["scraping", "crawler", "spider", "xpath", "css", "beautifulsoup", "scrapy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Markup :: HTML",
]
dynamic = ["version"]

[project.optional-dependencies]
# netweir.images converts images and makes thumbnails with Pillow.
images = ["pillow>=11"]
# JMESPath queries over JSON (page.jmespath, Node.jmespath), as parsel.
jmespath = ["jmespath>=1.0"]

[project.scripts]
netweir = "netweir._cli:main"

[project.urls]
Homepage = "https://netweir.com/"
Documentation = "https://docs.netweir.com/"
Repository = "https://github.com/netweir/netweir"
Issues = "https://github.com/netweir/netweir/issues"
Changelog = "https://github.com/netweir/netweir/releases"

[dependency-groups]
# pip only so editors that list packages with `python -m pip list` (VS
# Code's Python extension) can; uv itself doesn't need it.
dev = ["pytest>=8", "pytest-asyncio>=1.2", "maturin>=1.15,<2", "ruff>=0.14", "pyarrow>=21", "pip>=25", "fsspec>=2025", "jsonschema>=4.23", "scrapy>=2.15", "warcio>=1.7", "pillow>=11", "jmespath>=1.0"]
bench = ["selectolax>=0.4", "lxml>=6", "cssselect>=1.3", "beautifulsoup4>=4.13", "parsel>=1.10", "trafilatura>=2.3.1", "markdownify>=1.2.3"]

[tool.maturin]
manifest-path = "crates/netweir-py/Cargo.toml"
python-source = "python"
module-name = "netweir._native"
# Browser profiles and block signatures are compiled into netweir-core but
# live at the top level. The cargo config carries the PyO3 flags that let
# threads scale (docs/design/threads.md), so a build from source gets them.
include = [
    { path = "profiles/*.toml", format = "sdist" },
    { path = "signatures/*.toml", format = "sdist" },
    { path = ".cargo/config.toml", format = "sdist" },
]

[tool.uv]
# uv installs the dependencies; `maturin develop` builds and installs
# netweir itself. If uv built it too, each `uv run` could swap the
# extension maturin just built for an older one of its own.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A test still running after five minutes prints every thread's stack and
# carries on, so a hang says where it is long before CI's limit ends it.
faulthandler_timeout = 300

[tool.ruff]
line-length = 100

extend-exclude = ["crates/netweir-html/tests/html5lib-tests"]

[tool.ruff.format]
# Examples in the docs line up their comments for reading.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# HTML fixtures run long; the formatter already wraps code.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["netweir"]
